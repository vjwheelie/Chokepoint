[project]
name = "chokepoint"
version = "0.1.0"
description = "Supply-chain risk workbench for the U.S. defense industrial base, built on public federal contracting data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
